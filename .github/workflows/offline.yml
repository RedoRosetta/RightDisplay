name: Offline source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Show available toolchain
        run: xcodebuild -version
      - name: Compile and run fake-backend tests
        run: |
          python3 Scripts/offline_targeted.py
          python3 Scripts/offline_recovery.py
          python3 Scripts/offline_build45.py
          python3 Scripts/test_signing.py
